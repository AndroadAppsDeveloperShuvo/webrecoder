<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Screen Recorder with Floating Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ফ্লোটিং আইকনের জন্য কাস্টম স্টাইল */
        #floatingControl {
            touch-action: none; /* মোবাইলে ড্র্যাগ করার সুবিধার জন্য */
            transition: background-color 0.3s, transform 0.1s;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col items-center py-10 px-4 relative overflow-hidden">

    <div class="max-w-4xl w-full bg-gray-800 p-6 md:p-8 rounded-2xl shadow-2xl border border-gray-700 z-10">
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-red-500 mb-2">🔴 Live Screen Recorder</h2>
            <p class="text-sm text-gray-400">ফ্লোটিং আইকন দিয়ে যেকোনো জায়গা থেকে রেকর্ডিং কন্ট্রোল করুন।</p>
        </div>

        <!-- Video Preview Area -->
        <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden border-2 border-gray-700 shadow-inner mb-6 flex items-center justify-center">
            <p id="placeholderText" class="text-gray-500 flex flex-col items-center pointer-events-none">
                <svg class="w-12 h-12 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                রেকর্ডিং প্রিভিউ এখানে দেখা যাবে
            </p>
            <video id="videoPreview" class="absolute inset-0 w-full h-full object-contain hidden" autoplay muted playsinline></video>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <a id="downloadBtn" class="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg hidden pointer-events-none opacity-50 col-span-1 md:col-span-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download Video
            </a>
        </div>
        
        <div id="errorMsg" class="mt-4 text-center text-red-400 text-sm hidden"></div>
    </div>

    <!-- Draggable Floating Action Button -->
    <div id="floatingControl" class="fixed bottom-10 right-10 w-16 h-16 bg-red-600 rounded-full shadow-[0_0_15px_rgba(220,38,38,0.5)] flex items-center justify-center cursor-grab active:cursor-grabbing z-50 group border-2 border-white/20">
        <!-- Default State Icon (Camera) -->
        <svg id="fabIconStart" class="w-8 h-8 text-white pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        
        <!-- Recording State Icon (Square / Stop) -->
        <svg id="fabIconStop" class="w-8 h-8 text-white hidden pointer-events-none" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 5a2 2 0 012-2h10a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V5zm3 2a1 1 0 00-1 1v4a1 1 0 001 1h8a1 1 0 001-1V8a1 1 0 00-1-1H6z" clip-rule="evenodd"></path></svg>
        
        <!-- Tooltip -->
        <span id="fabTooltip" class="absolute -top-10 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Start Recording</span>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        let isRecording = false;

        const videoPreview = document.getElementById('videoPreview');
        const placeholderText = document.getElementById('placeholderText');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorMsg = document.getElementById('errorMsg');
        
        // FAB Elements
        const fab = document.getElementById('floatingControl');
        const fabIconStart = document.getElementById('fabIconStart');
        const fabIconStop = document.getElementById('fabIconStop');
        const fabTooltip = document.getElementById('fabTooltip');

        // Dragging Logic Variables
        let isDragging = false;
        let startX, startY, initialMouseX, initialMouseY;
        let clickPrevented = false;

        // --- Drag & Drop Logic for Floating Button ---
        fab.addEventListener('mousedown', dragStart);
        fab.addEventListener('touchstart', dragStart, { passive: false });

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, { passive: false });

        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            initialMouseX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            initialMouseY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            const rect = fab.getBoundingClientRect();
            startX = rect.left;
            startY = rect.top;
            
            isDragging = true;
            clickPrevented = false;
        }

        function drag(e) {
            if (!isDragging) return;
            
            const currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const currentY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            
            const dx = currentX - initialMouseX;
            const dy = currentY - initialMouseY;
            
            // If moved more than 5px, it's a drag, not a click
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                clickPrevented = true;
                e.preventDefault();
                
                // Boundaries check
                let newLeft = startX + dx;
                let newTop = startY + dy;
                
                const maxX = window.innerWidth - fab.offsetWidth;
                const maxY = window.innerHeight - fab.offsetHeight;
                
                if (newLeft < 0) newLeft = 0;
                if (newLeft > maxX) newLeft = maxX;
                if (newTop < 0) newTop = 0;
                if (newTop > maxY) newTop = maxY;
                
                fab.style.left = `${newLeft}px`;
                fab.style.top = `${newTop}px`;
                fab.style.right = 'auto';
                fab.style.bottom = 'auto';
            }
        }

        function dragEnd() {
            isDragging = false;
        }

        // --- Recording Logic ---
        
        // Handle Clicks on the Floating Button (Ignores clicks if it was dragged)
        fab.addEventListener('click', (e) => {
            if (clickPrevented) return;
            
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        async function startRecording() {
            try {
                stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: true
                });

                videoPreview.srcObject = stream;
                videoPreview.classList.remove('hidden');
                placeholderText.classList.add('hidden');
                errorMsg.classList.add('hidden');
                downloadBtn.classList.add('hidden');

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    downloadBtn.href = url;
                    downloadBtn.download = `ScreenRecord_${new Date().getTime()}.webm`;
                    downloadBtn.classList.remove('hidden', 'pointer-events-none', 'opacity-50');
                    
                    videoPreview.srcObject = null;
                    videoPreview.src = url;
                    videoPreview.controls = true;
                    
                    updateFabUI(false);
                };

                recordedChunks = [];
                mediaRecorder.start();
                updateFabUI(true);

                stream.getVideoTracks()[0].onended = function () {
                    if(mediaRecorder.state === "recording") {
                        stopRecording();
                    }
                };

            } catch (err) {
                console.error("Error: " + err);
                errorMsg.innerText = "Error: পারমিশন দেওয়া হয়নি অথবা আপনার ব্রাউজার এটি সাপোর্ট করে না।";
                errorMsg.classList.remove('hidden');
            }
        }

        function stopRecording() {
            if(mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                stream.getTracks().forEach(track => track.stop());
            }
        }

        // Update Floating Button Appearance Based on State
        function updateFabUI(recordingState) {
            isRecording = recordingState;
            if (recordingState) {
                // Recording Active UI
                fab.classList.remove('bg-red-600');
                fab.classList.add('bg-gray-800', 'animate-pulse');
                fab.style.boxShadow = '0 0 20px rgba(239,68,68,0.8)';
                
                fabIconStart.classList.add('hidden');
                fabIconStop.classList.remove('hidden');
                fabIconStop.classList.add('text-red-500');
                fabTooltip.innerText = "Stop Recording";
            } else {
                // Recording Stopped UI
                fab.classList.add('bg-red-600');
                fab.classList.remove('bg-gray-800', 'animate-pulse');
                fab.style.boxShadow = '0 0 15px rgba(220,38,38,0.5)';
                
                fabIconStart.classList.remove('hidden');
                fabIconStop.classList.add('hidden');
                fabIconStop.classList.remove('text-red-500');
                fabTooltip.innerText = "Start Recording";
            }
        }
    </script>
</body>
</html>
